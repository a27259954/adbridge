# Every push to main that changes code publishes a GitHub release.
#
# Version: <VERSION file>.<n>, where n is one more than the highest existing
# v<VERSION>.* tag (e.g. VERSION=0.1 → v0.1.0, v0.1.1, …). Bump VERSION for
# a new minor/major line. Put [skip release] in the commit message to skip.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to compute the next version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+$') { throw "VERSION must look like 0.1, got '$base'" }
          $max = -1
          foreach ($t in git tag --list "v$base.*") {
            if ($t -match "^v$([regex]::Escape($base))\.(\d+)$") { $max = [Math]::Max($max, [int]$Matches[1]) }
          }
          $v = "$base.$($max + 1)"
          "version=$v" >> $env:GITHUB_OUTPUT
          "Releasing v$v" >> $env:GITHUB_STEP_SUMMARY

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Go vet and test
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          go test -race ./internal/...

      - name: Stamp version into exe metadata
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $p = "build/windows/info.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.fixed.file_version = $v
          $j.info.'0000'.ProductVersion = $v
          $j | ConvertTo-Json -Depth 5 | Set-Content $p -Encoding utf8

      - name: Build adbridge.exe
        run: wails3 task build "EXTRA_LDFLAGS=-X main.version=v${{ steps.version.outputs.version }}"

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash bin/adbridge.exe -Algorithm SHA256).Hash.ToLower()
          "$h  adbridge.exe" | Out-File -Encoding ascii bin/adbridge.exe.sha256
          "SHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: adbridge v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            bin/adbridge.exe
            bin/adbridge.exe.sha256
