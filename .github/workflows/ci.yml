# Checks for pull requests and non-main branches (main is checked by release.yml).
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          CGO_ENABLED: "1" # race detector; the runner image ships MinGW gcc
        run: go test -race ./internal/...
