name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: adbridge stays small on purpose. It connects phones reliably and gives agents a safe debugging surface. Requests that serve that goal are the most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. For new MCP tools, say which permission level it should need.
