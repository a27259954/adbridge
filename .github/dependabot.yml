version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the wails3 CLI pinned in .github/workflows/*.yml (and the
      # generated bindings); upgrade both together by hand.
      - dependency-name: github.com/wailsapp/wails/v3

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # svelte-check's peer range is typescript ^5 || ^6; revisit when it adds 7.
      - dependency-name: typescript
        versions: [">=7"]
      # Keep the runtime in step with the Wails module (see above).
      - dependency-name: "@wailsio/runtime"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
